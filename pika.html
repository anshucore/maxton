<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PIKA 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#fff5f8;
    --void-2:#ffeaf1;
    --flash:#5f4550;
    --amber:#ff8fb1;
    --amber-soft:rgba(255,143,177,0.20);
    --save:#62c9a3;
    --skip:#ff789c;
    --muted:#a98795;
    --line:rgba(95,69,80,0.10);
    --pink-dark:#d95f86;
    --pink-soft:#fff0f5;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    background:radial-gradient(ellipse at 50% -12%, #ffdce8 0%, var(--void) 58%);
    color:var(--flash);
    font-family:'Inter', sans-serif;
    overflow:hidden;
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
  }
  .stage{
    height:100vh; height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto;
  }
  .topbar{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:2px 4px 14px;
  }
  .brand{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:21px;
    letter-spacing:0.06em;
    color:var(--pink-dark);
  }
  .brand::before{ content:'♥'; color:var(--amber); font-size:13px; margin-right:8px; vertical-align:middle; }
  .counter{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted);
    letter-spacing:0.03em;
  }

  .deck{
    flex:1; width:100%; position:relative;
    display:flex; align-items:center; justify-content:center;
    min-height:0;
  }
  .card{
    position:absolute;
    width:min(78vw, 300px);
    background:#ffffff;
    padding:12px 12px 46px;
    border-radius:16px;
    box-shadow:0 18px 45px rgba(184,104,132,0.20), 0 2px 0 rgba(255,255,255,0.9) inset;
    touch-action:none;
    user-select:none;
    will-change:transform;
  }
  .card .photo{
    width:100%; aspect-ratio:4/5; overflow:hidden; background:#ffe4ec; border-radius:10px;
    position:relative;
  }
  .card .photo img{
    width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;
  }
  .card .caption{
    padding:10px 4px 2px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    line-height:1.45;
    color:#684f5b;
    word-wrap:break-word;
    white-space:pre-wrap;
  }
  .card .stamp-row{
    position:absolute; left:16px; right:16px; bottom:14px;
    display:flex; justify-content:space-between; align-items:center;
    font-family:'JetBrains Mono', monospace; font-size:10.5px; color:#a98795;
    letter-spacing:0.02em;
  }
  .card .idx{ color:#c79aaa; }

  .badge{
    position:absolute; top:26px; padding:7px 14px; border:3px solid; border-radius:12px;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; letter-spacing:0.06em;
    transform:rotate(-12deg); opacity:0; pointer-events:none; text-transform:uppercase;
  }
  .badge.save{ left:22px; color:var(--save); border-color:var(--save); transform:rotate(-12deg); }
  .badge.skip{ right:22px; color:var(--skip); border-color:var(--skip); transform:rotate(12deg); }

  .hint{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted);
    text-align:center; padding:14px 10px 6px; letter-spacing:0.02em;
  }

  .controls{ display:flex; justify-content:center; padding:10px 0 4px; }
  .shutter{
    width:70px; height:70px; border-radius:50%;
    border:3px solid var(--amber); background:rgba(255,255,255,0.75);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0;
    transition:transform 0.15s ease;
  }
  .shutter:active{ transform:scale(0.92); }
  .shutter-inner{
    width:54px; height:54px; border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 0 7px var(--amber-soft);
  }
  .shutter.busy .shutter-inner{
    animation:pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; } 50%{ opacity:0.4; }
  }

  .state-msg{
    text-align:center; padding:0 30px; color:var(--muted);
  }
  .state-msg .big{
    font-family:'Space Grotesk', sans-serif; font-size:20px; color:var(--flash);
    margin-bottom:8px; font-weight:600;
  }
  .state-msg .small{
    font-family:'JetBrains Mono', monospace; font-size:12.5px; line-height:1.6;
  }

  .flash-overlay{
    position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none;
    z-index:40; transition:opacity 0.08s ease-out;
  }
  .flash-overlay.show{ opacity:0.9; transition:opacity 0.03s ease-out; }

  .toast{
    position:fixed; bottom:max(96px, calc(96px + env(safe-area-inset-bottom)));
    left:50%; transform:translateX(-50%) translateY(10px);
    background:#ffffff; color:var(--void); padding:10px 18px; border-radius:20px;
    font-family:'JetBrains Mono', monospace; font-size:12.5px;
    opacity:0; pointer-events:none; transition:all 0.25s ease; z-index:45;
    max-width:80vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  #file-input{ display:none; }

  .caption-modal{
    position:fixed; inset:0; background:rgba(255,211,225,0.82); backdrop-filter:blur(5px);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50; opacity:0; pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .caption-modal.show{ opacity:1; pointer-events:auto; }
  .caption-sheet{
    width:min(86vw, 340px); background:#ffffff; color:var(--void);
    border-radius:20px; padding:14px; box-shadow:0 24px 60px rgba(184,104,132,0.28);
    transform:translateY(8px); transition:transform 0.2s ease;
  }
  .caption-modal.show .caption-sheet{ transform:translateY(0); }
  .caption-preview{
    width:100%; aspect-ratio:4/5; border-radius:4px; overflow:hidden;
    background:#d8d2c2; margin-bottom:12px;
  }
  .caption-preview img{ width:100%; height:100%; object-fit:cover; display:block; }
  .caption-sheet textarea{
    width:100%; min-height:64px; resize:none; border-radius:6px;
    border:1px solid rgba(0,0,0,0.15); padding:10px; font-family:'Inter', sans-serif;
    font-size:14px; color:var(--void); background:#fff8fa; outline:none;
  }
  .caption-sheet textarea:focus{ border-color:var(--amber); }
  .caption-actions{ display:flex; gap:10px; padding-top:12px; }
  .cap-btn{
    flex:1; padding:11px 10px; border-radius:20px; border:none; cursor:pointer;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13.5px;
    letter-spacing:0.02em;
  }
  .cap-btn.cap-cancel{ background:#fff5f8; color:var(--flash); border:1px solid rgba(95,69,80,0.15); }
  .cap-btn.cap-send{ background:var(--amber); color:#fff; }
  .cap-btn:active{ transform:scale(0.97); }
</style>
</head>
<body>

<div class="stage">
  <div class="topbar">
    <div class="brand">PIKA 💗</div>
    <div class="counter" id="counter"></div>
  </div>

  <div class="deck" id="deck"></div>

  <div class="hint">swipe left to save &nbsp;·&nbsp; swipe right to skip &nbsp;·&nbsp; tap the shutter to send one</div>

  <div class="controls">
    <button class="shutter" id="shutterBtn" aria-label="Take and send an instant">
      <span class="shutter-inner"></span>
    </button>
  </div>
</div>

<input type="file" id="file-input" accept="image/*" capture="environment">
<div class="flash-overlay" id="flash"></div>
<div class="toast" id="toast"></div>

<div class="caption-modal" id="captionModal">
  <div class="caption-sheet">
    <div class="caption-preview"><img id="captionPreview" alt="Photo preview"></div>
    <textarea id="captionInput" maxlength="140" placeholder="Add a caption… (optional)"></textarea>
    <div class="caption-actions">
      <button class="cap-btn cap-cancel" id="captionCancel">Cancel</button>
      <button class="cap-btn cap-send" id="captionSend">Send instant</button>
    </div>
  </div>
</div>

<!-- Supabase client library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){

  // ============================================================
  // PIKA uses the SAME Supabase project URL/key as the supplied page,
  // but has its OWN table and storage bucket so PIKA stays separate.
  //
  // Run this once in the Supabase SQL editor before using this page:
  //
    // create table pika_instants (
    //   id text primary key,
    //   img_url text not null,
    //   img_path text not null,
    //   caption text,
    //   created_at timestamptz not null default now()
    // );
    // alter table pika_instants enable row level security;
    // create policy "public read" on pika_instants for select using (true);
    // create policy "public insert" on pika_instants for insert with check (true);
    // create policy "public delete" on pika_instants for delete using (true);
  //
  //   Then in Storage, create a public bucket named "pika".
  // Finally, in Database > Replication, turn on realtime for
  // the "pika_instants" table (insert + delete).
  // ============================================================
  const SUPABASE_URL = 'https://qpeoldazjmctxaefdwni.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_dm8NgOu_Wt1f7ussG76qkw_ODaRW-1h';
  const BUCKET = 'pika';
  const TABLE = 'pika_instants';
  // ============================================================

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const deckEl = document.getElementById('deck');
  const counterEl = document.getElementById('counter');
  const shutterBtn = document.getElementById('shutterBtn');
  const fileInput = document.getElementById('file-input');
  const flashEl = document.getElementById('flash');
  const toastEl = document.getElementById('toast');
  const captionModal = document.getElementById('captionModal');
  const captionPreview = document.getElementById('captionPreview');
  const captionInput = document.getElementById('captionInput');
  const captionCancel = document.getElementById('captionCancel');
  const captionSend = document.getElementById('captionSend');

  let queue = [];
  let dragging = false;
  let consuming = false;
  let pendingBlob = null;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2400);
  }

  function flash(){
    flashEl.classList.add('show');
    setTimeout(()=> flashEl.classList.remove('show'), 260);
  }

  function updateCounter(){
    counterEl.textContent = queue.length
      ? queue.length + (queue.length === 1 ? ' instant' : ' instants')
      : '';
  }

  // ---- Database helpers ----
  async function loadQueue(){
    const { data, error } = await supabase
      .from(TABLE).select('*').order('created_at', { ascending: true });
    if(error){ console.error(error); showToast("Couldn't load instants."); return []; }
    return data || [];
  }

  async function removeFromDb(entry){
    try{
      await supabase.storage.from(BUCKET).remove([entry.img_path]);
      const { error } = await supabase.from(TABLE).delete().eq('id', entry.id);
      if(error) console.error(error);
    }catch(err){ console.error(err); }
  }

  async function downloadImage(url, filename){
    try{
      const res = await fetch(url);
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(objUrl);
    }catch(err){
      console.error(err);
      window.open(url, '_blank');
    }
  }

  function fmtTime(iso){
    try{
      return new Date(iso).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
    }catch(e){ return ''; }
  }

  // ---- Rendering ----
  function render(){
    deckEl.innerHTML = '';

    if(queue.length === 0){
      const msg = document.createElement('div');
      msg.className = 'state-msg';
      msg.innerHTML = '<div class="big">No PIKA moments yet</div><div class="small">Neeche tap karo aur PIKA moment bhejoo ...</div>';
      deckEl.appendChild(msg);
      updateCounter();
      return;
    }

    const visible = queue.slice(0, 3);
    for(let i = visible.length - 1; i >= 0; i--){
      deckEl.appendChild(buildCard(visible[i], i));
    }
    updateCounter();

    const front = deckEl.querySelector('.card[data-idx="0"]');
    if(front) attachDrag(front);
  }

  function buildCard(entry, stackIdx){
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = entry.id;
    card.dataset.idx = stackIdx;

    const scale = 1 - stackIdx * 0.05;
    const y = stackIdx * 14;
    const rot = stackIdx === 0 ? 0 : (stackIdx % 2 === 0 ? -3 : 3);
    card.style.transform = `translateY(${y}px) scale(${scale}) rotate(${rot}deg)`;
    card.style.zIndex = String(10 - stackIdx);
    card.style.opacity = stackIdx === 2 ? '0.6' : '1';

    const photo = document.createElement('div');
    photo.className = 'photo';
    const img = document.createElement('img');
    img.src = entry.img_url;
    img.alt = 'A PIKA photo';
    img.draggable = false;
    photo.appendChild(img);
    card.appendChild(photo);

    if(entry.caption){
      const cap = document.createElement('div');
      cap.className = 'caption';
      cap.textContent = entry.caption;
      card.appendChild(cap);
    }

    const row = document.createElement('div');
    row.className = 'stamp-row';
    row.innerHTML = `<span>${fmtTime(entry.created_at)}</span><span class="idx">${stackIdx === 0 ? 'now' : ''}</span>`;
    card.appendChild(row);

    if(stackIdx === 0){
      const saveBadge = document.createElement('div');
      saveBadge.className = 'badge save';
      saveBadge.textContent = 'save';
      const skipBadge = document.createElement('div');
      skipBadge.className = 'badge skip';
      skipBadge.textContent = 'skip';
      card.appendChild(saveBadge);
      card.appendChild(skipBadge);
    }

    return card;
  }

  // ---- Drag / swipe ----
  function attachDrag(card){
    let startX = 0, startY = 0, dx = 0, dy = 0;
    const saveBadge = card.querySelector('.badge.save');
    const skipBadge = card.querySelector('.badge.skip');
    const THRESHOLD = 110;

    function onDown(e){
      if(consuming) return;
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      card.setPointerCapture(e.pointerId);
      card.style.transition = 'none';
      card.addEventListener('pointermove', onMove);
      card.addEventListener('pointerup', onUp);
      card.addEventListener('pointercancel', onUp);
    }
    function onMove(e){
      if(!dragging) return;
      dx = e.clientX - startX; dy = e.clientY - startY;
      const rot = dx / 16;
      card.style.transform = `translate(${dx}px, ${dy * 0.35}px) rotate(${rot}deg)`;
      if(saveBadge) saveBadge.style.opacity = Math.min(1, Math.max(0, -dx / THRESHOLD));
      if(skipBadge) skipBadge.style.opacity = Math.min(1, Math.max(0, dx / THRESHOLD));
    }
    function onUp(){
      if(!dragging) return;
      dragging = false;
      card.removeEventListener('pointermove', onMove);
      card.removeEventListener('pointerup', onUp);
      card.style.transition = 'transform 0.35s cubic-bezier(.2,.8,.3,1), opacity 0.35s';

      if(dx <= -THRESHOLD){
        finishSwipe(card, -1, true);
      } else if(dx >= THRESHOLD){
        finishSwipe(card, 1, false);
      } else {
        card.style.transform = '';
        if(saveBadge) saveBadge.style.opacity = 0;
        if(skipBadge) skipBadge.style.opacity = 0;
      }
      dx = 0; dy = 0;
    }
    card.addEventListener('pointerdown', onDown);

    // keyboard fallback for desktop
    document.onkeydown = (e) => {
      if(consuming || queue.length === 0) return;
      if(e.key === 'ArrowLeft') finishSwipe(card, -1, true);
      if(e.key === 'ArrowRight') finishSwipe(card, 1, false);
    };
  }

  function finishSwipe(card, dir, wantsDownload){
    if(consuming) return;
    consuming = true;
    card.style.transform = `translate(${dir * 700}px, -30px) rotate(${dir * 45}deg)`;
    card.style.opacity = '0';

    const entry = queue.shift();
    updateCounter();

    (async () => {
      if(wantsDownload && entry){
        await downloadImage(entry.img_url, 'pika-' + entry.id + '.jpg');
        showToast('Saved to your device');
      }
      if(entry) await removeFromDb(entry);
    })();

    setTimeout(() => {
      consuming = false;
      render();
    }, 320);
  }

  // ---- Capture & send ----
  function compressImage(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const maxW = 1000;
          const scale = Math.min(1, maxW / img.width);
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.82);
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  shutterBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if(!file) return;

    try{
      const blob = await compressImage(file);
      openCaptionModal(blob);
    }catch(err){
      console.error(err);
      showToast("Couldn't process that photo.");
    }
  });

  // ---- Caption modal ----
  function openCaptionModal(blob){
    pendingBlob = blob;
    captionPreview.src = URL.createObjectURL(blob);
    captionInput.value = '';
    captionModal.classList.add('show');
    setTimeout(() => captionInput.focus(), 60);
  }

  function closeCaptionModal(){
    captionModal.classList.remove('show');
    if(captionPreview.src) URL.revokeObjectURL(captionPreview.src);
    captionPreview.removeAttribute('src');
    pendingBlob = null;
  }

  captionCancel.addEventListener('click', closeCaptionModal);

  captionSend.addEventListener('click', () => {
    if(!pendingBlob) return;
    const blob = pendingBlob;
    const caption = captionInput.value.trim().slice(0, 140);
    closeCaptionModal();
    sendInstant(blob, caption);
  });

  captionInput.addEventListener('keydown', (e) => {
    if((e.metaKey || e.ctrlKey) && e.key === 'Enter') captionSend.click();
  });

  async function sendInstant(blob, caption){
    shutterBtn.classList.add('busy');
    flash();
    try{
      const id = 'i' + Date.now() + Math.random().toString(36).slice(2, 8);
      const path = id + '.jpg';

      const { error: upErr } = await supabase.storage
        .from(BUCKET).upload(path, blob, { contentType: 'image/jpeg', upsert: false });
      if(upErr) throw upErr;

      const { data: pub } = supabase.storage.from(BUCKET).getPublicUrl(path);
      const row = {
        id,
        img_url: pub.publicUrl,
        img_path: path,
        caption: caption || null,
        created_at: new Date().toISOString()
      };
      const { error: insErr } = await supabase.from(TABLE).insert(row);
      if(insErr) throw insErr;

      showToast('Instant sent');
    }catch(err){
      console.error(err);
      showToast("Couldn't send that instant.");
    }finally{
      shutterBtn.classList.remove('busy');
    }
  }

  // ---- Realtime: pick up instants others send / consume ----
  function subscribeRealtime(){
    supabase
      .channel('public:' + TABLE)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: TABLE }, payload => {
        const row = payload.new;
        if(queue.some(e => e.id === row.id)) return;
        queue.push(row);
        if(!dragging && !consuming) render();
        else updateCounter();
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: TABLE }, payload => {
        const id = payload.old.id;
        const wasFront = queue[0] && queue[0].id === id;
        queue = queue.filter(e => e.id !== id);
        if(!dragging && !consuming && wasFront) render();
        else updateCounter();
      })
      .subscribe();
  }

  async function init(){
    deckEl.innerHTML = '<div class="state-msg"><div class="small">loading instants…</div></div>';
    queue = await loadQueue();
    render();
    subscribeRealtime();
  }

  init();
})();
</script>
</body>
</html>
